about:
  heading: "About the Lab"
  body: |
    FEC CSE Research Lab (FEC CSE Lab) brings together faculty, research
    assistants, and student researchers working across artificial intelligence,
    computing systems, and emerging technologies. We pursue rigorous, publishable
    research while training the next generation of computing researchers.
  mission: "To conduct impactful, reproducible research and build an open, collaborative environment for computing scholars at every career stage."
  vision: "To be recognised as a leading computing research centre known for the quality of its publications and the strength of its people."
  # Lab Director's welcome message. Replace name/designation/message with the
  # real details, and drop a photo into public/images/people/ then reference
  # it below (e.g. "images/people/director.jpg") — same pattern as everyone else.
  director:
    name: "Md. Shamsul Islam"
    designation: "Lab Director"
    photo: "images/people/director.jpg"
    message: |
      Welcome to FEC Research Lab. Our goal is to build a strong research environment in the field of Computer Science and Engineering, where students can explore emerging technologies and contribute to innovative solutions.
      We focus on advancing research in areas such as Artificial Intelligence, Machine Learning, Deep Learning, Computer Vision, Natural Language Processing, Data Science, and Software Engineering. Through collaboration, mentorship, and hands-on research experience, we aim to develop skilled researchers capable of addressing real-world challenges.
      We encourage students to explore, experiment, and transform their ideas into impactful research outcomes. Together, we are building a culture of innovation and excellence at Faridpur Engineering College.

